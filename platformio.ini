; TWANG32 - custom build
; Hardware: NodeMCU-32S (ESP32-WROOM-32)
;   SK6812 strip, 5 m @ 30 LEDs/m = 150 LEDs, data on GPIO 16
;   MPU6050 on the default I2C pins (SDA 21 / SCL 22)
;   Audio: internal DAC on GPIO 25 -> PAM8403 amplifier
;
; Build:   pio run
; Flash:   pio run -t upload
; Serial:  pio device monitor

[env:nodemcu-32s]
; Pinned to the 6.x line = arduino-esp32 2.0.x. The sound engine uses the old
; hw_timer API (timerBegin/timerAlarmWrite), which arduino-esp32 3.x removed.
platform = espressif32@^6.9.0
board = nodemcu-32s
framework = arduino

lib_deps =
	fastled/FastLED@^3.9.19

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; Uncomment to print raw joystick/gyro values over serial for calibration
; build_flags = -DJOYSTICK_DEBUG

; TWANG32 - custom build
; Hardware: NodeMCU-32S (ESP32-WROOM-32)
;   SK6812 strip, 5 m @ 30 LEDs/m = 150 LEDs, data on GPIO 16
;   MPU6050 on the default I2C pins (SDA 21 / SCL 22)
;   Audio: internal DAC on GPIO 25 -> PAM8403 amplifier
;
; Build:   pio run
; Flash:   pio run -t upload
; Serial:  pio device monitor

[env:nodemcu-32s]
; Pinned to the 6.x line = arduino-esp32 2.0.x. The sound engine uses the old
; hw_timer API (timerBegin/timerAlarmWrite), which arduino-esp32 3.x removed.
platform = espressif32@^6.9.0
board = nodemcu-32s
framework = arduino

lib_deps =
	fastled/FastLED@^3.9.19
	bblanchon/ArduinoJson@^7.2.0

; Two app slots are mandatory for OTA self-update. The board default also has
; them, but at 1.25 MB each - and WiFi + TLS + HTTP + JSON push the image close
; enough to that ceiling to be uncomfortable. min_spiffs gives 1.9 MB per slot.
board_build.partitions = min_spiffs.csv

; BOARD_TAG picks the firmware image on the server: it is the <board> in
; firmware/<board>.bin, so devices only ever pull a build meant for them.
build_flags = -DBOARD_TAG=\"esp32dev\"

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; Uncomment to print raw joystick/gyro values over serial for calibration
; build_flags = -DJOYSTICK_DEBUG

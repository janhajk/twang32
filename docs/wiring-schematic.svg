<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 645" role="img" aria-label="Schematic: ESP32 carrier board with terminals 1 to 10, sound module powered from VIN and GND pins with L on terminal 10 and G on terminal 4, MPU6050 on terminals 5, 8, 9, and the 9-wire cable carrying 5 V, GND, data and clock to the LED strip and 5 V supply at the far end.">
    <defs><style>
      .t{font-family:"IBM Plex Mono",monospace;fill:#97A3B8;font-size:11px}
      .tb{font-family:"IBM Plex Mono",monospace;fill:#E6EBF3;font-size:13px;font-weight:600}
      .ts{font-family:"IBM Plex Mono",monospace;fill:#97A3B8;font-size:9.5px}
      .tf{font-family:"IBM Plex Mono",monospace;fill:#66738A;font-size:9.5px}
      .h{font-family:Archivo,sans-serif;fill:#E6EBF3;font-size:14px;font-weight:600}
      .w{fill:none;stroke-width:2.5;stroke-linejoin:round}
      .halo{fill:none;stroke:#0A0D13;stroke-width:8}
      .box{fill:#19202C;stroke:#26303F}
    </style></defs><rect x="0" y="0" width="1000" height="645" fill="#0A0D13"/>

    <!-- carrier board -->
    <rect x="20" y="48" width="660" height="300" rx="6" fill="none" stroke="#26303F" stroke-dasharray="5 4"/>
    <text class="tf" x="30" y="292">carrier board</text>

    <!-- ESP32 module -->
    <rect class="box" x="60" y="70" width="560" height="120" rx="4"/>
    <rect x="36" y="110" width="24" height="40" rx="2" fill="#26303F"/>
    <text class="ts" x="48" y="166" text-anchor="middle">USB</text>
    <text class="h" x="360" y="128" text-anchor="middle">ESP32 &#183; NodeMCU-32S</text>
    <text class="t" x="360" y="150" text-anchor="middle">GPIO 16/17 &#8594; T6/T7 &#183; 21/22 &#8594; T8/T9 &#183; 25 &#8594; T10</text>
    <rect x="114" y="64" width="12" height="12" fill="#E0362B"/>
    <text class="ts" x="120" y="92" text-anchor="middle">VIN</text>
    <rect x="164" y="64" width="12" height="12" fill="#C9D1DC"/>
    <text class="ts" x="170" y="92" text-anchor="middle">GND</text>

    <!-- sound module power, soldered to the pins -->
    <path class="w" stroke="#E0362B" d="M120 64V24H680V74H720"/>
    <path class="w" stroke="#C9D1DC" d="M170 64V40H665V99H720"/>
    <text class="ts" x="400" y="17" text-anchor="middle">soldered directly to the VIN / GND pins, not via terminals</text>

    <!-- sound module -->
    <rect class="box" x="720" y="40" width="170" height="170" rx="4"/>
    <text class="h" x="812" y="60" text-anchor="middle">Sound module</text>
    <text class="tf" x="812" y="76" text-anchor="middle">PAM8403</text>
    <text class="ts" x="728" y="78">VCC</text>
    <text class="ts" x="728" y="103">GND</text>
    <text class="ts" x="728" y="143">L</text>
    <text class="ts" x="728" y="168">G</text>
    <text class="tf" x="728" y="193">R &#183; open</text>
    <text class="ts" x="882" y="116" text-anchor="end">L+</text>
    <text class="ts" x="882" y="142" text-anchor="end">L&#8722;</text>
    <path class="w" stroke="#97A3B8" d="M890 112H930M890 138H930"/>
    <rect x="930" y="110" width="12" height="30" fill="none" stroke="#97A3B8" stroke-width="2"/>
    <path d="M942 110L962 96V154L942 140" fill="none" stroke="#97A3B8" stroke-width="2"/>
    <text class="ts" x="950" y="172" text-anchor="middle">speaker</text>
    <text class="tf" x="805" y="228" text-anchor="middle">BTL output: L&#8722; never to GND</text>

    <!-- L and G inputs -->
    <path class="w" stroke="#FF8A1F" d="M620 300V280H705V139H720"/>
    <path class="w" stroke="#C9D1DC" d="M260 300V255H690V164H720"/>
    <text class="ts" x="636" y="274">D25 &#8594; L</text>
    <text class="ts" x="420" y="249">G &#8594; GND (T4, or T2)</text>

    <!-- board terminals -->
    <g>
      <rect x="58" y="300" width="44" height="40" rx="3" fill="#121721" stroke="#FF3B30"/><text class="tb" x="80" y="318" text-anchor="middle">1</text><text class="ts" x="80" y="333" text-anchor="middle">5V</text>
      <rect x="118" y="300" width="44" height="40" rx="3" fill="#121721" stroke="#66738A"/><text class="tb" x="140" y="318" text-anchor="middle">2</text><text class="ts" x="140" y="333" text-anchor="middle">GND</text>
      <rect x="178" y="300" width="44" height="40" rx="3" fill="#121721" stroke="#FF3B30"/><text class="tb" x="200" y="318" text-anchor="middle">3</text><text class="ts" x="200" y="333" text-anchor="middle">5V</text>
      <rect x="238" y="300" width="44" height="40" rx="3" fill="#121721" stroke="#66738A"/><text class="tb" x="260" y="318" text-anchor="middle">4</text><text class="ts" x="260" y="333" text-anchor="middle">GND</text>
      <rect x="298" y="300" width="44" height="40" rx="3" fill="#121721" stroke="#FF3B30"/><text class="tb" x="320" y="318" text-anchor="middle">5</text><text class="ts" x="320" y="333" text-anchor="middle">3V3</text>
      <rect x="358" y="300" width="44" height="40" rx="3" fill="#121721" stroke="#3D8BFF"/><text class="tb" x="380" y="318" text-anchor="middle">6</text><text class="ts" x="380" y="333" text-anchor="middle">D16</text>
      <rect x="418" y="300" width="44" height="40" rx="3" fill="#121721" stroke="#3D8BFF"/><text class="tb" x="440" y="318" text-anchor="middle">7</text><text class="ts" x="440" y="333" text-anchor="middle">D17</text>
      <rect x="478" y="300" width="44" height="40" rx="3" fill="#121721" stroke="#C77DFF"/><text class="tb" x="500" y="318" text-anchor="middle">8</text><text class="ts" x="500" y="333" text-anchor="middle">D21</text>
      <rect x="538" y="300" width="44" height="40" rx="3" fill="#121721" stroke="#C77DFF"/><text class="tb" x="560" y="318" text-anchor="middle">9</text><text class="ts" x="560" y="333" text-anchor="middle">D22</text>
      <rect x="598" y="300" width="44" height="40" rx="3" fill="#121721" stroke="#FF8A1F"/><text class="tb" x="620" y="318" text-anchor="middle">10</text><text class="ts" x="620" y="333" text-anchor="middle">D25</text>
    </g>

    <!-- MPU6050, local -->
    <path class="w" stroke="#C77DFF" stroke-dasharray="5 4" d="M560 340V352H712V272H740"/>
    <path class="w" stroke="#C77DFF" stroke-dasharray="5 4" d="M500 340V362H722V292H740"/>
    <path class="w" stroke="#FF3B30" stroke-dasharray="5 4" d="M320 340V372H732V312H740"/>
    <rect class="box" x="740" y="252" width="160" height="80" rx="4" stroke-dasharray="5 4"/>
    <text class="ts" x="750" y="276">SCL</text>
    <text class="ts" x="750" y="296">SDA</text>
    <text class="ts" x="750" y="316">VCC</text>
    <text class="h" x="890" y="276" text-anchor="end">MPU6050</text>
    <text class="ts" x="890" y="294" text-anchor="end">joystick</text>
    <text class="tf" x="890" y="316" text-anchor="end">GND: board</text>
    <text class="tf" x="820" y="348" text-anchor="middle">local, not via cable</text>

    <!-- cable conductors -->
    <path class="halo" d="M380 364V380M440 364V380"/>
    <path d="M80 340V470" stroke="#5A6475" stroke-width="4.5"/><path d="M80 340V470" stroke="#000" stroke-width="2.5"/>
    <path class="w" stroke="#7B4A26" d="M140 340V470"/>
    <path class="w" stroke="#E0362B" d="M200 340V470"/>
    <path class="w" stroke="#F28A1E" d="M260 340V470"/>
    <path class="w" stroke="#2BA84A" d="M380 340V470"/>
    <path class="w" stroke="#2E6BE6" d="M440 340V470"/>
    <rect x="52" y="392" width="416" height="44" rx="10" fill="rgba(255,255,255,0.05)" stroke="#26303F"/>
    <text class="t" x="482" y="410">9-wire cable</text>
    <text class="tf" x="482" y="426">5 yellow &#183; 8 purple &#183; 9 grey: spare</text>

    <!-- far-end terminals -->
    <g>
      <rect x="62" y="470" width="36" height="30" rx="3" fill="#121721" stroke="#26303F"/><text class="tb" x="80" y="490" text-anchor="middle">1</text>
      <rect x="122" y="470" width="36" height="30" rx="3" fill="#121721" stroke="#26303F"/><text class="tb" x="140" y="490" text-anchor="middle">2</text>
      <rect x="182" y="470" width="36" height="30" rx="3" fill="#121721" stroke="#26303F"/><text class="tb" x="200" y="490" text-anchor="middle">3</text>
      <rect x="242" y="470" width="36" height="30" rx="3" fill="#121721" stroke="#26303F"/><text class="tb" x="260" y="490" text-anchor="middle">4</text>
      <g opacity="0.35"><rect x="302" y="470" width="36" height="30" rx="3" fill="#121721" stroke="#26303F"/><text class="tb" x="320" y="490" text-anchor="middle">5</text></g>
      <rect x="362" y="470" width="36" height="30" rx="3" fill="#121721" stroke="#26303F"/><text class="tb" x="380" y="490" text-anchor="middle">6</text>
      <rect x="422" y="470" width="36" height="30" rx="3" fill="#121721" stroke="#26303F"/><text class="tb" x="440" y="490" text-anchor="middle">7</text>
      <g opacity="0.35"><rect x="482" y="470" width="36" height="30" rx="3" fill="#121721" stroke="#26303F"/><text class="tb" x="500" y="490" text-anchor="middle">8</text></g>
      <g opacity="0.35"><rect x="542" y="470" width="36" height="30" rx="3" fill="#121721" stroke="#26303F"/><text class="tb" x="560" y="490" text-anchor="middle">9</text></g>
    </g>
    <text class="tf" x="596" y="490">far-end terminals</text>

    <!-- far end: buses, bridges, supply -->
    <path class="w" stroke="#E0362B" d="M80 500V525H740M200 500V525"/>
    <path class="w" stroke="#C9D1DC" d="M140 548H740"/>
    <text class="ts" x="476" y="519">5 V bus &#183; 1 + 3 bridged</text>
    <text class="ts" x="476" y="542">GND bus &#183; 2 + 4 bridged</text>
    <path class="halo" d="M140 515V535M260 515V535M380 515V558M440 515V558"/>
    <path class="w" stroke="#7B4A26" d="M140 500V548"/>
    <path class="w" stroke="#F28A1E" d="M260 500V548"/>
    <path class="w" stroke="#2BA84A" d="M380 500V586"/>
    <path class="w" stroke="#2E6BE6" d="M440 500V586"/>
    <path class="w" stroke="#E0362B" d="M110 525V586"/>
    <path class="w" stroke="#F4F4F4" d="M170 548V586"/>
    <circle cx="80" cy="525" r="4" fill="#E0362B"/><circle cx="110" cy="525" r="4" fill="#E0362B"/><circle cx="200" cy="525" r="4" fill="#E0362B"/>
    <circle cx="140" cy="548" r="4" fill="#C9D1DC"/><circle cx="170" cy="548" r="4" fill="#C9D1DC"/><circle cx="260" cy="548" r="4" fill="#C9D1DC"/>
    <text class="tf" x="104" y="576" text-anchor="end">red</text>
    <text class="tf" x="176" y="576">white</text>
    <text class="tf" x="374" y="576" text-anchor="end">green</text>
    <text class="tf" x="446" y="576">blue</text>
    <rect class="box" x="740" y="505" width="150" height="62" rx="4"/>
    <text class="tb" x="752" y="530">+</text>
    <text class="tb" x="752" y="553">&#8722;</text>
    <text class="h" x="825" y="534" text-anchor="middle">5 V PSU</text>
    <text class="ts" x="825" y="552" text-anchor="middle">5&#8211;6 A</text>

    <!-- strip -->
    <rect x="60" y="590" width="460" height="36" rx="4" fill="#0C1017" stroke="#26303F"/>
    <rect x="105" y="586" width="10" height="8" fill="#97A3B8"/><rect x="165" y="586" width="10" height="8" fill="#97A3B8"/><rect x="375" y="586" width="10" height="8" fill="#97A3B8"/><rect x="435" y="586" width="10" height="8" fill="#97A3B8"/>
    <text class="ts" x="110" y="610" text-anchor="middle">5V</text>
    <text class="ts" x="170" y="610" text-anchor="middle">GND</text>
    <text class="ts" x="380" y="610" text-anchor="middle">DI</text>
    <text class="ts" x="440" y="610" text-anchor="middle">CI</text>
    <text class="t" x="275" y="614" text-anchor="middle">SK9822 strip &#183; input end</text>
    <circle cx="476" cy="608" r="3" fill="#3D8BFF"/><circle cx="488" cy="608" r="3" fill="#FF3B30"/><circle cx="500" cy="608" r="3" fill="#FF8A1F"/><circle cx="512" cy="608" r="3" fill="#2BD96A"/>
  </svg>
